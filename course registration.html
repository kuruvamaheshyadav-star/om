<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <h1>Course Registration</h1>
    
    <fieldset>
    <legend>Personal Details</legend>
    <form action="thank you.html">
        <table>

        <tr>
            <td><label>Name</label></td>
            <td><input type="text" name="FN" placeholder="Ex:Mohan" required></td>
        </tr>
        <tr>
            <td><label>Surname</label></td>
            <td><input type="text" name="SN" placeholder="Ex:Raj" required></td>
        </tr>
        <tr>
            <td><label>mobile Number</label></td>
            <td><input type="tel" name="MN" placeholder="999-887-4646" required></td>
        </tr>
        <tr>
            <td><label>Email</label></td>
            <td><input type="email" name="email" placeholder="mah@gmail.com" required></td>
        </tr>
        </table>
        <label>Password</label>
        <input type="password" required><br>
        <label>Confirm Password</label>
        <input type="password" required><br>
        <label>DOB</label>
        <input type="date" required><br>
        <label>Gender</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female
        <input type="radio" name="Gender">Other<br>
       
        <label>Select Country</label>
        <select>
            <option>INDIA</option>
            <option>USA</option>
            <option>JAPAN</option>
        </select><br>
        <label>Upload photo</label>
        <input type="file"><br>
        <input type="reset"><br>


         <input type="submit"> 
        
        



    </form>
    </fieldset>
</body>
</html>
